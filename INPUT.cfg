# ============================  IntraHB  INPUT.cfg  ============================
# IntraHB by Deepak Patkar - based on Deshmukh, Bartolotti & Gadre, JPCA 2008, 112, 312
# Section names are only for readability.  "#" starts a comment.

[SYSTEM]
xyz_file = [rahb.xyz]           # one or more: [a.xyz, b.gjf]  (wildcards allowed)
nproc    = 8
mem      = 12GB
outdir   = .                    # a sub-folder per molecule is created here

[THEORY]
method       = MP2
basis        = aug-cc-pVTZ
keywords     = scf=tight
charge       = auto             # auto = from a Gaussian input, else 0
multiplicity = auto             # auto = from a Gaussian input, else from electron count

[HB]
hb_donor        = N,O,F
hb_acceptor     = N,O,F,S,Cl
hb_distance_min = 1.2           # H...A, Angstrom
hb_distance_max = 2.5
hb_angle_min    = 100           # D-H...A, degrees
hb_angle_max    = 180
hb_min_bonds    = 3             # min. covalent bonds between D and A
# Manual HBs replace detection (1-based atom numbers):
# hb1 = 3 4 10
# hb2 = 11 12 5  agroup=1,3-5

[FRAGMENT]
cap_distance       = 1.0        # cap H distance, Angstrom
network_link_bonds = 2          # HBs whose D/A atoms are this close (in bonds) form a network

[RUN]
mode        = gen               # detect | gen | run | cal
njob        = 1                 # parallel Gaussian jobs in run mode
run_command = g16 {input}
